<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ZMP icon: an original low-poly (N64-era) green cap and a blue ocarina. Not a copy of any official artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14304f"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3fd0a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fd0a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fc4ff"/>
      <stop offset="0.55" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#1b4fa8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <circle cx="256" cy="220" r="230" fill="url(#glow)"/>

  <!-- low-poly cap, leaning right, tip at the top right -->
  <g stroke="#0d2b1a" stroke-width="3" stroke-linejoin="round">
    <polygon points="122,318 196,196 246,306" fill="#2f9e44"/>
    <polygon points="246,306 196,196 280,142" fill="#43b85a"/>
    <polygon points="246,306 280,142 360,302" fill="#2b8a3e"/>
    <polygon points="360,302 280,142 368,168" fill="#237533"/>
    <polygon points="196,196 280,142 238,120" fill="#69db7c"/>
    <polygon points="238,120 280,142 330,96" fill="#8ce99a"/>
    <polygon points="280,142 368,168 330,96" fill="#5fd17a"/>
    <polygon points="330,96 368,168 430,140" fill="#43b85a"/>
    <polygon points="368,168 430,140 446,236" fill="#2b8a3e"/>
    <polygon points="430,140 446,236 462,214" fill="#237533"/>
    <!-- brim band -->
    <polygon points="104,316 360,296 372,342 98,362" fill="#1d6b2d"/>
    <polygon points="104,316 230,306 226,352 98,362" fill="#24803a"/>
  </g>

  <!-- ocarina -->
  <g>
    <ellipse cx="232" cy="402" rx="112" ry="62" fill="url(#oc)" stroke="#0c2a5c" stroke-width="4"/>
    <path d="M330,378 L392,350 L404,372 L342,402 Z" fill="#2f7fe0" stroke="#0c2a5c" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="200" cy="384" rx="44" ry="14" fill="#ffffff" fill-opacity="0.28"/>
    <circle cx="176" cy="414" r="9" fill="#0c2a5c"/>
    <circle cx="212" cy="420" r="9" fill="#0c2a5c"/>
    <circle cx="248" cy="420" r="9" fill="#0c2a5c"/>
    <circle cx="284" cy="412" r="9" fill="#0c2a5c"/>
  </g>

  <!-- six small lights: up to six players -->
  <g fill="#ffd43b" stroke="#7a5b00" stroke-width="2">
    <circle cx="70" cy="140" r="9"/>
    <circle cx="98" cy="98" r="9"/>
    <circle cx="146" cy="72" r="9"/>
    <circle cx="436" cy="300" r="9"/>
    <circle cx="452" cy="350" r="9"/>
    <circle cx="436" cy="400" r="9"/>
  </g>
</svg>
